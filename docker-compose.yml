# Local stack: PostgreSQL + the application + development mocks (fake
# Confluence and fake OpenID Connect provider). Start with `make up`, then open
# http://localhost:8080 and use the PAT "dev-pat" in the preferences.
#
# The mocks share the app's network namespace so that "localhost:8091" (OIDC
# issuer) and "localhost:8090" (Confluence) resolve identically for the
# browser and for the backend, as they would with real, public services.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: c2d
      POSTGRES_PASSWORD: c2d
      POSTGRES_DB: c2d
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c2d"]
      interval: 5s
      retries: 10

  app:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://c2d:c2d@db:5432/c2d?sslmode=disable
      PUBLIC_URL: http://localhost:8080
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://localhost:8091}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-confluence-to-doc}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-dev-secret}
      OIDC_ADMIN_GROUPS: ${OIDC_ADMIN_GROUPS:-c2d-admins}
      CONFLUENCE_BASE_URL: ${CONFLUENCE_BASE_URL:-http://localhost:8090}
      # Development-only key. Generate your own with: openssl rand -base64 32
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-ZGV2LW9ubHktZGV2LW9ubHktZGV2LW9ubHktZGV2LTA=}
      LOG_FORMAT: text
      # Traces and metrics go to the local Jaeger; unset to disable telemetry.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_SERVICE_NAME: confluence-to-doc
      # Notification emails land in Mailpit: http://localhost:8025
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURITY: ${SMTP_SECURITY:-none}
      SMTP_FROM: ${SMTP_FROM:-Confluence Export <noreply@example.com>}
    depends_on:
      db:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "8080:8080" # application
      - "8090:8090" # fake Confluence (devmocks)
      - "8091:8091" # fake OIDC provider (devmocks)
    volumes:
      - exports:/data

  # The application sends OTLP here, as it would in production. The collector
  # forwards traces to Jaeger and logs metrics (Jaeger stores traces only).
  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector:0.161.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otel/config.yaml:ro
    depends_on:
      - jaeger

  # Catches the notification emails; UI on :8025.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025" # Mailpit UI

  # Trace backend for local development; UI on :16686.
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "16686:16686" # Jaeger UI

  devmocks:
    build:
      context: .
      target: devmocks
    network_mode: "service:app"
    depends_on:
      - app

volumes:
  db-data:
  exports:
