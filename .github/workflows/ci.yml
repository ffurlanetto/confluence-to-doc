name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: c2d
          POSTGRES_PASSWORD: c2d
          POSTGRES_DB: c2d
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U c2d" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://c2d:c2d@localhost:5432/c2d?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Same toolchain as the Docker build stage (go.mod keeps the minimum version).
          go-version: "1.27"
          cache-dependency-path: backend/go.sum
      - name: Install LibreOffice (conversion tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui fonts-liberation
      - name: Check formatting and modules
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go mod tidy && git diff --exit-code go.mod go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: backend
      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Lint
        run: helm lint charts/confluence-to-doc -f charts/confluence-to-doc/values-production.yaml
      - name: Render and validate against the Kubernetes schemas
        run: |
          helm template c2d charts/confluence-to-doc \
            -f charts/confluence-to-doc/values-production.yaml > /tmp/rendered.yaml
          curl -sSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          /tmp/kubeconform -strict -summary /tmp/rendered.yaml
      - name: Reject an install that is missing its required values
        run: |
          if helm template c2d charts/confluence-to-doc >/dev/null 2>&1; then
            echo "the chart rendered without the values it cannot work without" >&2
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: false
          tags: confluence-to-doc:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
