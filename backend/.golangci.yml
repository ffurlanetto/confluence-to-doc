version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gosec
    - misspell
    - noctx
    - nilerr
    - revive
    - unconvert
    - usestdlibvars
  settings:
    gosec:
      excludes:
        - G204 # soffice is invoked with a fixed binary and controlled arguments
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose, errcheck, usestdlibvars]
      - path: internal/(auth/oidcmock|confluence/fake)/
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ffurlanetto/confluence-to-doc
