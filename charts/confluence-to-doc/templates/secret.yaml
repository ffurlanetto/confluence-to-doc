{{- /*
Only the values the operator asked this chart to manage end up here; anything
referenced through an existingSecret stays where it is.
*/ -}}
{{- $managed := dict -}}
{{- if and .Values.database.url (not .Values.database.existingSecret) -}}
{{- $_ := set $managed "DATABASE_URL" .Values.database.url -}}
{{- end -}}
{{- if and .Values.oidc.clientSecret (not .Values.oidc.existingSecret) -}}
{{- $_ := set $managed "OIDC_CLIENT_SECRET" .Values.oidc.clientSecret -}}
{{- end -}}
{{- if and .Values.encryptionKey (not .Values.existingEncryptionKeySecret) -}}
{{- $_ := set $managed "ENCRYPTION_KEY" .Values.encryptionKey -}}
{{- end -}}
{{- if and (eq .Values.storage.type "s3") (not .Values.storage.s3.existingSecret) -}}
{{- if .Values.storage.s3.accessKeyId -}}
{{- $_ := set $managed "S3_ACCESS_KEY_ID" .Values.storage.s3.accessKeyId -}}
{{- $_ := set $managed "S3_SECRET_ACCESS_KEY" .Values.storage.s3.secretAccessKey -}}
{{- end -}}
{{- end -}}
{{- if $managed }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "confluence-to-doc.secretName" . }}
  labels: {{- include "confluence-to-doc.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $managed }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
